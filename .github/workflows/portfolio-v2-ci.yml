name: Portfolio v2 quality checks

on:
  push:
    branches: [feat/portfolio-v2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and build both HTML entries
        run: npm run build
      - name: Verify both published pages exist
        run: |
          test -f dist/index.html
          test -f dist/preview-v2.html
