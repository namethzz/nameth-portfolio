name: One-time authentic OTW preview capture
on:
  push:
    branches:
      - feat/portfolio-v2

jobs:
  capture:
    if: contains(github.event.head_commit.message, '[capture]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install screenshot browser driver
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Verify and capture the live OTW storefront
        run: node scripts/capture-project-previews.mjs
      - name: Commit only verified real screenshot to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/work/otw-*.png
          if git diff --cached --quiet; then
            echo "No screenshot changes"
            exit 0
          fi
          git commit -m "assets(v2): add authentic OTW live storefront screenshot"
          git push origin HEAD:feat/portfolio-v2
